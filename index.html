<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>擇日知錄 - 農民曆</title>
<style>
  :root {
    --red: #c0392b;
    --dark-red: #922b21;
    --gold: #d4a017;
    --dark-gold: #b8860b;
    --bg: #fdf6ec;
    --card-bg: #fffbf2;
    --text: #2c1810;
    --text-light: #8b6914;
    --border: #e8d5b0;
    --green: #27ae60;
    --shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Noto Serif TC", "新細明體", serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--dark-red) 0%, var(--red) 100%);
    color: #fff;
    padding: 1.5rem 1rem;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(135deg, var(--dark-gold) 0%, var(--gold) 100%);
  }
  .header h1 {
    font-size: 2rem;
    letter-spacing: .5rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,.3);
    margin-bottom: .3rem;
  }
  .header .sub { font-size: .9rem; opacity: .85; letter-spacing: .2rem; }

  /* Date Picker */
  .date-bar {
    background: #fff;
    border-bottom: 2px solid var(--border);
    padding: .6rem .8rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: .4rem;
    flex-wrap: nowrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .date-bar label { font-weight: 700; color: var(--red); display: none; }
  .date-bar input[type="date"] {
    font-size: .95rem;
    padding: .45rem .6rem;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .2s;
    flex: 1;
    min-width: 0;
  }
  .date-bar input:focus { border-color: var(--red); outline: none; }
  .date-bar button {
    padding: .45rem .8rem;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-today {
    background: var(--red);
    color: #fff;
  }
  .btn-today:hover { background: var(--dark-red); }
  .btn-nav {
    background: #fff;
    border: 2px solid var(--border) !important;
    color: var(--text);
    font-size: 1.1rem !important;
    padding: .45rem .6rem !important;
    flex-shrink: 0;
  }
  .btn-nav:hover { background: var(--bg); border-color: var(--red) !important; }

  /* Main Container */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem 1rem;
  }

  /* Top Banner - Date Info */
  .date-banner {
    background: linear-gradient(135deg, var(--red) 0%, #a93226 100%);
    color: #fff;
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 20px rgba(192,57,43,.25);
    position: relative;
    overflow: hidden;
  }
  .date-banner::before {
    content: '黃';
    position: absolute;
    right: -20px; top: -30px;
    font-size: 12rem;
    opacity: .06;
    font-weight: 900;
  }
  .date-banner .ganzhi-year {
    font-size: 1.1rem;
    letter-spacing: .3rem;
    opacity: .9;
    margin-bottom: .5rem;
  }
  .date-banner .lunar-date {
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: .3rem;
    text-shadow: 2px 2px 6px rgba(0,0,0,.2);
    margin-bottom: .3rem;
  }
  .date-banner .gregorian {
    font-size: 1rem;
    opacity: .8;
    margin-bottom: .8rem;
  }
  .date-banner .tags {
    display: flex;
    justify-content: center;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .date-banner .tag {
    background: rgba(255,255,255,.2);
    padding: .3rem .8rem;
    border-radius: 20px;
    font-size: .85rem;
    backdrop-filter: blur(4px);
  }

  /* Grid Layout */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
  }
  .grid .full { grid-column: 1 / -1; }

  /* Card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,.1); }
  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--red);
    border-bottom: 2px solid var(--border);
    padding-bottom: .5rem;
    margin-bottom: .8rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .card-title .icon { font-size: 1.2rem; }

  /* Ganzhi Card */
  .ganzhi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .8rem;
    text-align: center;
  }
  .ganzhi-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem .5rem;
  }
  .ganzhi-item .label {
    font-size: .75rem;
    color: var(--text-light);
    margin-bottom: .3rem;
  }
  .ganzhi-item .value {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--red);
  }
  .ganzhi-item .sub {
    font-size: .75rem;
    color: var(--text-light);
    margin-top: .2rem;
  }

  /* Yi Ji (宜忌) */
  .yiji-section { margin-bottom: 1rem; }
  .yiji-section:last-child { margin-bottom: 0; }
  .yiji-label {
    display: inline-block;
    padding: .2rem .8rem;
    border-radius: 4px;
    font-weight: 700;
    font-size: .9rem;
    margin-bottom: .5rem;
  }
  .yiji-label.yi { background: #e8f5e9; color: #2e7d32; }
  .yiji-label.ji { background: #ffebee; color: #c62828; }
  .yiji-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
  }
  .yiji-tag {
    background: #fff;
    border: 1px solid var(--border);
    padding: .25rem .6rem;
    border-radius: 6px;
    font-size: .85rem;
    transition: all .2s;
    position: relative;
    cursor: help;
  }
  .yiji-tag.yi { border-color: #a5d6a7; color: #2e7d32; }
  .yiji-tag.ji { border-color: #ef9a9a; color: #c62828; }
  .yiji-tag.yi:hover { background: #e8f5e9; }
  .yiji-tag.ji:hover { background: #ffebee; }
  .yiji-tag .tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: .5rem .8rem;
    border-radius: 6px;
    font-size: .8rem;
    white-space: nowrap;
    z-index: 200;
    pointer-events: none;
    line-height: 1.5;
    max-width: 280px;
    white-space: normal;
    text-align: center;
  }
  .yiji-tag .tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #333;
  }
  .yiji-tag:hover .tip,
  .yiji-tag:active .tip {
    display: block;
  }
  @media (max-width: 768px) {
    .yiji-tag .tip {
      white-space: normal;
      min-width: 200px;
      max-width: 250px;
      font-size: .75rem;
    }
  }

  /* Hours */
  .hours-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: .5rem;
  }
  .hour-item {
    text-align: center;
    padding: .5rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
  }
  .hour-item.good { border-color: #a5d6a7; background: #f1f8e9; }
  .hour-item.bad { border-color: #ef9a9a; background: #fce4ec; }
  .hour-item .time { font-weight: 700; font-size: 1rem; }
  .hour-item .gz { font-size: .75rem; color: var(--text-light); }
  .hour-item .status { font-size: .7rem; font-weight: 700; margin-top: .2rem; }
  .hour-item.good .status { color: #2e7d32; }
  .hour-item.bad .status { color: #c62828; }

  /* Solar Term */
  .solar-term-display {
    text-align: center;
    padding: 1rem;
  }
  .solar-term-display .term-name {
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 1px 1px 3px rgba(0,0,0,.1);
  }
  .solar-term-display .term-range {
    font-size: .85rem;
    color: var(--text-light);
    margin-top: .3rem;
  }
  .solar-term-display .next-term {
    font-size: .8rem;
    color: var(--text-light);
    margin-top: .5rem;
    padding-top: .5rem;
    border-top: 1px dashed var(--border);
  }

  /* Direction */
  .direction-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .5rem;
  }
  .direction-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .direction-item .dir-label {
    font-weight: 700;
    color: var(--red);
    min-width: 2.5rem;
  }
  .direction-item .dir-value { font-size: .9rem; }

  /* Peng Taboo */
  .peng-text {
    font-size: 1.1rem;
    line-height: 1.8;
    color: var(--text);
    text-align: center;
    padding: .5rem;
  }

  /* Deity */
  .deity-list {
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .deity-item {
    background: linear-gradient(135deg, #fff9e6 0%, #fff 100%);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: .6rem 1rem;
    font-weight: 700;
    color: var(--dark-gold);
    text-align: center;
  }
  .deity-detail {
    display: none;
  }
  .deity-detail.show {
    display: block;
  }
  .deity-detail b {
    color: var(--red);
  }

  /* Star 28 */
  .star-display {
    text-align: center;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--dark-red);
    padding: .5rem;
    position: relative;
    cursor: help;
  }
  .star-display .tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: .5rem .8rem;
    border-radius: 6px;
    font-size: .8rem;
    z-index: 200;
    pointer-events: none;
    line-height: 1.5;
    max-width: 280px;
    white-space: normal;
    text-align: center;
    font-weight: 400;
  }
  .star-display .tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #333;
  }
  .star-display:hover .tip {
    display: block;
  }

  /* Officer */
  .officer-display {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1.5rem;
    padding: .5rem;
  }
  .officer-main {
    text-align: center;
  }
  .officer-main .name {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--red);
  }
  .officer-main .god {
    font-size: .9rem;
    color: var(--text-light);
  }
  .officer-badge {
    padding: .3rem .8rem;
    border-radius: 20px;
    font-size: .85rem;
    font-weight: 700;
  }
  .officer-badge.yellow { background: #fff8e1; color: var(--dark-gold); border: 1px solid var(--gold); }
  .officer-badge.black { background: #efebe9; color: #5d4037; border: 1px solid #bcaaa4; }

  /* Nine Star */
  .ninestar-display {
    display: flex;
    justify-content: center;
    gap: .3rem;
    flex-wrap: wrap;
  }
  .ninestar-cell {
    width: 2.5rem; height: 2.5rem;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border);
    border-radius: 6px;
    font-weight: 900;
    font-size: 1.1rem;
    background: #fff;
  }
  .ninestar-cell.center { border-color: var(--red); color: var(--red); background: #fff5f5; }

  /* Five Elements */
  .elements-list {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    justify-content: center;
  }
  .element-chip {
    padding: .3rem .8rem;
    border-radius: 20px;
    font-size: .85rem;
    background: #fff;
    border: 1px solid var(--border);
  }

  /* Gods */
  .gods-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .5rem;
  }
  .gods-section .god-tag {
    display: inline-block;
    padding: .2rem .5rem;
    margin: .15rem;
    border-radius: 4px;
    font-size: .8rem;
    position: relative;
    cursor: help;
  }
  .god-tag.good { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .god-tag.bad { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .god-tag .tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: .5rem .8rem;
    border-radius: 6px;
    font-size: .8rem;
    z-index: 200;
    pointer-events: none;
    line-height: 1.5;
    max-width: 280px;
    white-space: normal;
    text-align: center;
  }
  .god-tag .tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #333;
  }
  .god-tag:hover .tip,
  .god-tag:active .tip {
    display: block;
  }
  @media (max-width: 768px) {
    .god-tag .tip {
      white-space: normal;
      min-width: 200px;
      max-width: 250px;
      font-size: .75rem;
    }
  }

  /* Charts Section */
  .charts-section {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .charts-top {
    grid-template-columns: repeat(3, 1fr);
  }
  .full-chart {
    grid-column: 1 / -1;
  }
  .chart-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
  }
  .chart-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }

  /* Calendar Chart */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .calendar-header {
    text-align: center;
    font-size: .75rem;
    font-weight: 700;
    color: var(--text-light);
    padding: .3rem;
  }
  .calendar-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    border: 2px solid transparent;
    min-width: 0;
    gap: .1rem;
  }
  .calendar-day:hover {
    transform: scale(1.1);
    z-index: 2;
  }
  .calendar-day.today {
    border-color: var(--red);
    box-shadow: 0 0 8px rgba(192,57,43,.3);
  }
  .calendar-day .day-num {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
  }
  .calendar-day .day-lunar {
    font-size: .6rem;
    opacity: .85;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
    color: inherit;
  }
  .calendar-day .day-solar-term {
    font-size: .55rem;
    font-weight: 700;
    line-height: 1;
    color: #E65100;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .level-1 { background: #E8F5E9; color: #388E3C; }
  .level-2 { background: #F1F8E9; color: #689F38; }
  .level-3 { background: #FFF8E1; color: #FFA000; }
  .level-4 { background: #FFF3E0; color: #E65100; }
  .level-5 { background: #FFEBEE; color: #D32F2F; }
  .level-0 { background: #F5F5F5; color: #9E9E9E; }

  /* Pie Chart */
  .pie-container {
    display: flex;
    align-items: center;
    gap: 2rem;
    justify-content: center;
  }
  .pie-chart {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    position: relative;
  }
  .pie-legend {
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .pie-legend-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .85rem;
  }
  .pie-legend-color {
    width: 1rem;
    height: 1rem;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* Five Elements Chart */
  .elements-chart {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .element-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    width: 60px;
  }
  .element-bar-fill {
    width: 100%;
    height: 120px;
    background: #f0f0f0;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .element-bar-inner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    border-radius: 8px;
    transition: height .5s ease;
  }
  .element-bar-label {
    font-size: .85rem;
    font-weight: 700;
  }
  .element-bar-count {
    font-size: .75rem;
    color: var(--text-light);
  }

  /* Full Month Elements Chart */
  .elements-full-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 3px;
  }
  .element-day-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: .65rem;
    font-weight: 600;
    position: relative;
    cursor: default;
    transition: transform .2s;
  }
  .element-day-cell:hover {
    transform: scale(1.2);
    z-index: 2;
  }
  .element-day-cell .day-num {
    font-size: .7rem;
    font-weight: 700;
  }
  .element-day-cell .day-el {
    font-size: .55rem;
    opacity: .8;
  }
  .el-gold { background: #FFF9C4; color: #F57F17; }
  .el-wood { background: #C8E6C9; color: #2E7D32; }
  .el-water { background: #BBDEFB; color: #1565C0; }
  .el-fire { background: #FFCDD2; color: #C62828; }
  .el-earth { background: #D7CCC8; color: #4E342E; }
  .element-legend {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .element-legend-item {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .8rem;
  }
  .element-legend-color {
    width: 1rem;
    height: 1rem;
    border-radius: 3px;
  }

  /* Solar Term Timeline */
  .solar-timeline {
    display: flex;
    flex-direction: column;
    gap: .8rem;
  }
  .solar-term-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: .5rem;
    border-radius: 8px;
    transition: background .2s;
  }
  .solar-term-item.current {
    background: #FFF8E1;
    border: 1px solid var(--gold);
  }
  .solar-term-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }
  .solar-term-item.current .solar-term-dot {
    background: var(--red);
    border-color: var(--red);
  }
  .solar-term-item.past .solar-term-dot {
    background: var(--border);
  }
  .solar-term-name {
    font-weight: 700;
    font-size: .9rem;
    min-width: 3rem;
  }
  .solar-term-date {
    font-size: .8rem;
    color: var(--text-light);
  }

  /* Level Bar */
  .level-bar {
    height: 6px;
    background: #f0f0f0;
    border-radius: 3px;
    overflow: hidden;
    margin-top: .3rem;
  }
  .level-bar-inner {

function init() {
  // 從 URL 參數讀取日期
  try {
    const params = new URLSearchParams(window.location.search);
    const dateParam = params.get('date');
    
    if (dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam)) {
      const parts = dateParam.split('-');
      currentDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    } else {
      throw new Error('no param');
    }
  } catch(e) {
    const today = new Date();
    const y = today.getFullYear();
    if (y >= 1970 && y <= 2100) {
      currentDate = today;
    } else {
      currentDate = new Date(2026, 4, 30);
    }
  }

  document.getElementById('dateInput').value = formatDate(currentDate);
  updateUrl();
  loadData();
}

function formatDate(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function onDateChange() {
  const val = document.getElementById('dateInput').value;
  if (val) {
    const parts = val.split('-');
    currentDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    updateUrl();
    loadData();
  }
}

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  document.getElementById('dateInput').value = formatDate(currentDate);
  updateUrl();
  loadData();
}

function goToday() {
  const today = new Date();
  if (today.getFullYear() >= 1970 && today.getFullYear() <= 2100) {
    currentDate = today;
  } else {
    currentDate = new Date(2026, 4, 30);
  }
  document.getElementById('dateInput').value = formatDate(currentDate);
  updateUrl();
  loadData();
}

function changeToDate(day) {
  currentDate.setDate(day);
  document.getElementById('dateInput').value = formatDate(currentDate);
  updateUrl();
  loadData();
}

function updateUrl() {
  try {
    const dateStr = formatDate(currentDate);
    const url = new URL(window.location);
    url.searchParams.set('date', dateStr);
    window.history.replaceState({}, '', url);
  } catch(e) {
    // file:// 協議不支援 URL 更新，忽略
  }
}

function getZodiacAge(clashYearGanzhi, currentYear) {
  if (!clashYearGanzhi || clashYearGanzhi.length < 2) return '';
  
  var stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  
  var yearStem = clashYearGanzhi[0];
  var yearBranch = clashYearGanzhi[1];
  
  var stemIdx = stems.indexOf(yearStem);
  var branchIdx = branches.indexOf(yearBranch);
  
  if (stemIdx === -1 || branchIdx === -1) return '';
  
  // 從干支推算年份
  // 甲子年 = 1984年
  // 六十甲子序號 = (天干序號 * 12 + 地支序號) % 60 / 2... 不對
  // 正確算法：循環60年找符合干支的年份
  var ages = [];
  for (var year = 1924; year <= currentYear; year++) {
    var yStemIdx = (year - 4) % 10;
    var yBranchIdx = (year - 4) % 12;
    if (yStemIdx < 0) yStemIdx += 10;
    if (yBranchIdx < 0) yBranchIdx += 12;
    if (yStemIdx === stemIdx && yBranchIdx === branchIdx) {
      var age = currentYear - year + 1;
      if (age > 0 && age < 120) {
        ages.push(age);
      }
    }
  }
  
  if (ages.length === 0) return '';
  return ages[ages.length - 1] + '歲';
}

function loadViaScript(y, m) {
  return new Promise((resolve, reject) => {
    const key = `_${y}_${m}`;
    if (window.LunarData[key]) {
      resolve(window.LunarData[key]);
      return;
    }
    const script = document.createElement('script');
    const base = getBasePath();
    const url = `${base}${y}/${m}.js`;
    console.log('Loading:', url);
    script.src = url;
    script.onload = function() {
      console.log('Loaded:', url, 'Data exists:', !!window.LunarData[key]);
      if (window.LunarData[key]) {
        resolve(window.LunarData[key]);
      } else {
        reject(new Error('資料格式錯誤'));
      }
      document.head.removeChild(script);
    };
    script.onerror = function(e) {
      console.error('Error loading:', url, e);
      document.head.removeChild(script);
      reject(new Error('無法載入 ' + y + '/' + m + '.js'));
    };
    document.head.appendChild(script);
  });
}

async function loadData() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div>載入中...</div>';

  const y = currentDate.getFullYear();
  const m = String(currentDate.getMonth() + 1).padStart(2, '0');
  const d = currentDate.getDate();

  try {
    const data = await loadViaScript(y, m);
    if (!data || !data.days) throw new Error('資料格式錯誤');
    const dayData = data.days.find(day => day.day === d);
    if (!dayData) throw new Error('找不到日期資料');
    render(dayData, data);
  } catch (err) {
    app.innerHTML = `<div class="loading" style="color:#c62828;">
      <div style="font-size:3rem;margin-bottom:1rem;">⚠</div>
      <div>無法載入 ${y} 年 ${m} 月 ${d} 日資料</div>
      <div style="font-size:.85rem;margin-top:.5rem;opacity:.7;">${err.message}</div>
    </div>`;
  }
}

                ${di.info.note ? `<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px dashed #e8d5b0;font-size:.8rem;color:#888;"><b>小知識：</b>${di.info.note}</div>` : ''}
              </div>
            </div>
            ` : ''}
          </div>`;
        }).join('') : d.deityBirthday.map(b => `<div class="deity-item">${b}</div>`).join('')}
      </div>
    </div>
    ` : ''}

    <!-- 吉凶等級 -->
    <div class="card">
      <div class="card-title"><span class="icon">吉</span>凶等級</div>
      <div class="level-display">
        <div class="level-stars">${levelStars}</div>
        <div class="level-desc">${d.todayLevelName}</div>
        <div style="margin-top:.5rem;">
          <span class="officer-badge ${d.isYellowRoad ? 'yellow' : 'black'}">
            ${d.isYellowRoad ? '黃道日' : '黑道日'}
          </span>
        </div>
      </div>
    </div>

    <!-- 節季 -->
    <div class="card">
      <div class="card-title"><span class="icon">季</span>節</div>
      <div class="peng-text" style="font-size:1.5rem;font-weight:900;">${d.season}</div>
    </div>

    <!-- 五行 -->
    <div class="card">
      <div class="card-title"><span class="icon">五</span>行</div>
      <div class="elements-list">
        ${d.fiveElements.map(e => `<span class="element-chip">${e}</span>`).join('')}
      </div>
    </div>

  </div>`;

  document.getElementById('app').innerHTML = html;
}

function renderNineStar(str) {
  const positions = ['中宮','西北','西','東北','南','北','西南','東','東南'];
  let html = '';
  for (let i = 0; i < 9 && i < str.length; i++) {
    const cls = i === 0 ? 'center' : '';
    html += `<div class="ninestar-cell ${cls}" title="${positions[i]}">${str[i]}</div>`;
  }
  return html;
}

function renderCalendar(allDays, currentDay) {
  const headers = ['日','一','二','三','四','五','六'];
  let html = '<div class="calendar-grid">';
  
  // 星期標題
  headers.forEach(h => {
    html += `<div class="calendar-header">${h}</div>`;
  });
  
  // 計算第一天是星期幾
  if (allDays.length > 0) {
    const firstDate = new Date(allDays[0].gregorian);
    const firstDay = firstDate.getDay();
    
    // 空白填充
    for (let i = 0; i < firstDay; i++) {
      html += '<div class="calendar-day"></div>';
    }
    
    // 日期
    allDays.forEach(day => {
      const level = Math.max(0, Math.min(5, day.todayLevel || 0));
      const isToday = day.day === currentDay;
      const lunarDay = day.lunar.dayName;
      const solarTerm = day.solarTerm ? day.solarTerm.name : '';
      const isSolarTermStart = day.solarTerm && day.solarTerm.startDate === day.gregorian;
      
      // 判斷顯示內容：節氣開始日顯示節氣名，否則顯示農曆
      let displayText = lunarDay;
      let displayClass = 'day-lunar';
      if (isSolarTermStart && solarTerm) {
        displayText = solarTerm;
        displayClass = 'day-solar-term';
      }
      
      const cls = `level-${level}${isToday ? ' today' : ''}`;
      
      html += `<div class="calendar-day ${cls}" onclick="changeToDate(${day.day})" title="${day.gregorian} ${solarTerm ? solarTerm : ''}">
        <span class="day-num">${day.day}</span>
        <span class="${displayClass}">${displayText}</span>
      </div>`;
    });
  }
  
  html += '</div>';
  return html;
}

function renderPieChart(allDays) {
  let good = 0, neutral = 0, bad = 0;
  
  allDays.forEach(day => {
    const level = day.todayLevel || 0;
    if (level <= 2) good++;
    else if (level === 3) neutral++;
    else bad++;
  });
  
  const total = allDays.length || 1;
  const goodPct = (good / total * 100).toFixed(1);
  const neutralPct = (neutral / total * 100).toFixed(1);
  const badPct = (bad / total * 100).toFixed(1);
  
  // 用 conic-gradient 做圓餅圖
  const goodDeg = good / total * 360;
  const neutralDeg = neutral / total * 360;
  
  const pieStyle = `background: conic-gradient(
    #81C784 0deg ${goodDeg}deg,
    #FFD54F ${goodDeg}deg ${goodDeg + neutralDeg}deg,
    #EF9A9A ${goodDeg + neutralDeg}deg 360deg
  );`;
  
  let html = `<div class="pie-container">
    <div class="pie-chart" style="${pieStyle}"></div>
    <div class="pie-legend">
      <div class="pie-legend-item">
        <div class="pie-legend-color" style="background:#81C784;"></div>
        <span>吉日 ${good} 天 (${goodPct}%)</span>
      </div>
      <div class="pie-legend-item">
        <div class="pie-legend-color" style="background:#FFD54F;"></div>
        <span>平日 ${neutral} 天 (${neutralPct}%)</span>
      </div>
      <div class="pie-legend-item">
        <div class="pie-legend-color" style="background:#EF9A9A;"></div>
        <span>凶日 ${bad} 天 (${badPct}%)</span>
      </div>
    </div>
  </div>`;
  
  return html;
}

function renderElementsChart(allDays) {
  const elements = { '金': 0, '木': 0, '水': 0, '火': 0, '土': 0 };
  
  allDays.forEach(day => {
    const nayin = day.dayGanzhi.nayin || '';
    if (nayin.includes('金')) elements['金']++;
    else if (nayin.includes('木')) elements['木']++;
    else if (nayin.includes('水')) elements['水']++;
    else if (nayin.includes('火')) elements['火']++;
    else if (nayin.includes('土')) elements['土']++;
  });
  
  const maxVal = Math.max(...Object.values(elements), 1);
  const colors = {
    '金': '#BDBDBD',
    '木': '#81C784',
    '水': '#64B5F6',
    '火': '#EF9A9A',
    '土': '#BCAAA4'
  };
  
  let html = '<div class="elements-chart">';
  
  for (const [el, count] of Object.entries(elements)) {
    const height = (count / maxVal * 100).toFixed(0);
    html += `<div class="element-bar">
      <div class="element-bar-fill">
        <div class="element-bar-inner" style="height:${height}%;background:${colors[el]};"></div>
      </div>
      <div class="element-bar-label" style="color:${colors[el]};">${el}</div>
      <div class="element-bar-count">${count}日</div>
    </div>`;
  }
  
  html += '</div>';
  return html;
}

function renderElementsChartFull(allDays) {
  const elColors = {
    '金': { bg: '#FFF9C4', color: '#F57F17', cls: 'el-gold' },
    '木': { bg: '#C8E6C9', color: '#2E7D32', cls: 'el-wood' },
    '水': { bg: '#BBDEFB', color: '#1565C0', cls: 'el-water' },
    '火': { bg: '#FFCDD2', color: '#C62828', cls: 'el-fire' },
    '土': { bg: '#D7CCC8', color: '#4E342E', cls: 'el-earth' }
  };
  
  const counts = { '金': 0, '木': 0, '水': 0, '火': 0, '土': 0 };
  
  let html = '<div class="elements-full-grid">';
  
  allDays.forEach(day => {
    const nayin = day.dayGanzhi.nayin || '';
    let el = '土';
    if (nayin.includes('金')) el = '金';
    else if (nayin.includes('木')) el = '木';
    else if (nayin.includes('水')) el = '水';
    else if (nayin.includes('火')) el = '火';
    else if (nayin.includes('土')) el = '土';
    
    counts[el]++;
    const cls = elColors[el].cls;
    
    html += `<div class="element-day-cell ${cls}" title="${day.gregorian} ${day.dayGanzhi.full} ${nayin}">
      <span class="day-num">${day.day}</span>
      <span class="day-el">${el}</span>
    </div>`;
  });
  
  html += '</div>';
  
  // 圖例
  html += '<div class="element-legend">';
  for (const [el, info] of Object.entries(elColors)) {
    html += `<div class="element-legend-item">
      <div class="element-legend-color" style="background:${info.bg};"></div>
      <span>${el} ${counts[el]}日</span>
    </div>`;
  }
  html += '</div>';
  
  return html;
}

function renderSolarTimeline(currentTerm) {
  const solarTerms = [
    '小寒', '大寒', '立春', '雨水', '驚蟄', '春分',
    '清明', '穀雨', '立夏', '小滿', '芒種', '夏至',
    '小暑', '大暑', '立秋', '處暑', '白露', '秋分',
    '寒露', '霜降', '立冬', '小雪', '大雪', '冬至'
  ];
  
  // 簡繁轉換對照
  const s2t = {
    '惊蛰': '驚蟄', '处暑': '處暑', '白露': '白露', '秋分': '秋分',
    '寒露': '寒露', '霜降': '霜降', '立冬': '立冬', '小雪': '小雪',
    '大雪': '大雪', '冬至': '冬至', '小寒': '小寒', '大寒': '大寒',
    '立春': '立春', '雨水': '雨水', '穀雨': '穀雨', '谷雨': '穀雨',
    '小满': '小滿', '芒种': '芒種', '夏至': '夏至', '小暑': '小暑',
    '大暑': '大暑', '立秋': '立秋', '立夏': '立夏', '清明': '清明',
    '春分': '春分'
  };
  
  const termName = s2t[currentTerm.name] || currentTerm.name;
  const currentIdx = solarTerms.indexOf(termName);
  
  let html = '<div class="solar-timeline">';
  
  // 只顯示前後各3個節氣
  const start = Math.max(0, currentIdx - 3);
  const end = Math.min(solarTerms.length, currentIdx + 4);
  
  for (let i = start; i < end; i++) {
    const term = solarTerms[i];
    let cls = '';
    if (i < currentIdx) cls = 'past';
    else if (i === currentIdx) cls = 'current';
    
    html += `<div class="solar-term-item ${cls}">
      <div class="solar-term-dot"></div>
      <div class="solar-term-name">${term}</div>
      <div class="solar-term-date">${i === currentIdx ? '← 現在' : ''}</div>
    </div>`;
  }
  
  html += '</div>';
  return html;
}

function renderHours(d) {
  const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  let html = '';
  branches.forEach(b => {
    const isGood = d.auspiciousHours.includes(b);
    const gz = d.hourGanzhi[b] || '';
    const cls = isGood ? 'good' : 'bad';
    const status = isGood ? '吉' : '凶';
    html += `
      <div class="hour-item ${cls}">
        <div class="time">${b}</div>
        <div class="gz">${gz}</div>
        <div class="status">${status}</div>
      </div>`;
  });
  return html;
}
